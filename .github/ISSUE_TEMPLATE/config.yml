blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/mcpredteam/mcp-redteam-junit/security/advisories/new
    about: >-
      Never report a vulnerability in a public issue. This includes detection bypasses — a
      payload a rule should catch and does not. See SECURITY.md.
  - name: Vulnerability you found in someone else's MCP server
    url: https://github.com/mcpredteam/mcp-redteam-junit/blob/main/SECURITY.md
    about: >-
      That is the other project's vulnerability to fix and disclose. Report it to them, not
      here. Do not name an unpatched third-party server in this tracker.
  - name: Question or idea
    url: https://github.com/mcpredteam/mcp-redteam-junit/discussions
    about: Open-ended questions and proposals before you build something.
