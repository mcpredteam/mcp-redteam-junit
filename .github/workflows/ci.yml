name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      # The whole pitch of this project is that MCP security checks belong in `mvn test`.
      # This job is that claim applied to itself.
      - name: Build and test
        run: mvn -B --no-transfer-progress verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-jdk${{ matrix.java }}
          path: '**/target/surefire-reports/'
          retention-days: 7

  # The example is documentation that executes, which is the only kind that cannot go stale
  # unnoticed. It resolves the *published* coordinates from Central rather than this build's
  # output, so this job also re-verifies that 0.1.0 is still resolvable and still works.
  #
  # Only the scanning example runs here: examples/agent needs a model, and every test in it is
  # tagged `live` and excluded from `mvn test` for exactly that reason.
  example:
    name: Example project (scan-only)
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run the example
        working-directory: examples/scan-only
        run: mvn -B --no-transfer-progress test
